[pytest]
# The repo is imported as top-level packages (`aria`, `aria_mcp`, `evals`) rather than being
# pip-installed, so the repo root has to be on `sys.path`.
#
# `python -m pytest` adds the working directory automatically and a bare `pytest` does not, so
# without this the suite passes locally and fails to collect in CI. That is exactly the kind of
# environment-shaped difference this workshop is about, so it gets pinned here rather than left
# to how you happen to invoke the runner.
pythonpath = .

testpaths = tests
