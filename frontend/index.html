<!DOCTYPE html>
<!--
  ARIA: a deliberately minimal front end.

  Open this file directly in a browser. No build step, no npm, no server for the page itself.

  It talks to the LangGraph Server REST API, which means it works against EITHER:

    1. A local server:   langgraph dev        ->  http://127.0.0.1:2024   (no API key)
    2. A deployment:     langgraph deploy     ->  https://<your>.us.langgraph.app  (+ API key)

  That is the point of having it. If `langgraph deploy` doesn't work for someone in the room,
  no Plus plan, Docker not running, corporate network, they paste the localhost URL and carry
  on. Nobody is blocked, and the rest of the workshop is identical either way, because both
  targets speak the same API and both write traces to the same LangSmith project.

  WHY A UI AT ALL, IN AN OBSERVABILITY WORKSHOP?
  Because Modules 3 and 4 need production traffic that a *human* generated. Script-generated
  traces are fine for looking at monitoring charts, but the interesting failures come from
  people asking things you didn't anticipate, which is exactly the lesson. Ten minutes of a
  room full of engineers trying to break ARIA produces better material for the annotation
  queue than any traffic generator.

  CORS: the LangGraph dev server allows all origins by default, so opening this from file://
  works. If your browser blocks it, serve the folder instead:
      python -m http.server 8080 --directory frontend
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARIA: Asset Reliability Information Assistant</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e8ec;
    --dim: #8b93a1; --accent: #4f9cf9; --warn: #f5a524; --err: #f04438; --ok: #12b76a;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: flex;
    flex-direction: column;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .sub { color: var(--dim); font-size: 12.5px; }
  header input {
    background: var(--bg); border: 1px solid var(--line); color: var(--text);
    padding: 6px 9px; border-radius: 6px; font: 12px var(--mono);
  }
  #url { width: 300px; } #key { width: 170px; } #graph { width: 90px; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  #dot.ok { background: var(--ok); } #dot.err { background: var(--err); }

  main { flex: 1; overflow-y: auto; padding: 22px 18px; }
  .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 11px; }
  .who {
    flex: none; width: 30px; height: 30px; border-radius: 7px; display: grid;
    place-items: center; font-size: 11px; font-weight: 700; letter-spacing: .3px;
  }
  .user .who { background: #22303f; color: #9dc7ff; }
  .aria .who { background: #23303a; color: #7ee0c0; }
  .sys .who  { background: #33291c; color: var(--warn); }
  .body { flex: 1; min-width: 0; }
  .body .name { font-size: 11.5px; color: var(--dim); margin-bottom: 3px; letter-spacing: .3px; }
  .body .text { white-space: pre-wrap; word-wrap: break-word; }
  .sys .text { color: var(--warn); font: 12.5px var(--mono); }
  .tools {
    margin-top: 8px; font: 11.5px var(--mono); color: var(--dim);
    border-left: 2px solid var(--line); padding-left: 9px;
  }
  .interrupt {
    margin-top: 11px; padding: 12px; border: 1px solid var(--warn); border-radius: 8px;
    background: #241d10;
  }
  .interrupt h3 { margin: 0 0 6px; font-size: 12.5px; color: var(--warn); letter-spacing: .3px; }
  .interrupt pre { margin: 6px 0 10px; font: 11.5px var(--mono); white-space: pre-wrap; color: var(--text); }
  .interrupt button { margin-right: 7px; }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 13px 18px; }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 9px; }
  textarea {
    flex: 1; resize: none; background: var(--bg); border: 1px solid var(--line);
    color: var(--text); border-radius: 8px; padding: 10px 12px; font: inherit; min-height: 44px;
  }
  button {
    background: var(--accent); border: 0; color: #06121f; font-weight: 650; padding: 0 17px;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  button:disabled { opacity: .5; cursor: default; }
  .hints { max-width: 820px; margin: 9px auto 0; display: flex; gap: 7px; flex-wrap: wrap; }
  .hints button {
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    font: 11.5px var(--mono); padding: 4px 9px; font-weight: 400;
  }
  .hints button:hover { color: var(--text); border-color: var(--accent); }
  .hints .probe { border-color: #4a2b2b; color: #d98b8b; }
</style>
</head>
<body>

<header>
  <div id="dot"></div>
  <h1>ARIA</h1>
  <span class="sub">refinery maintenance &amp; HSE assistant</span>
  <span style="flex:1"></span>
  <label class="sub">server <input id="url" value="http://127.0.0.1:2024"></label>
  <label class="sub">graph <input id="graph" value="aria"></label>
  <label class="sub">key <input id="key" type="password" placeholder="lsv2_… (deploy only)"></label>
  <button class="ghost" id="reset">New thread</button>
</header>

<main><div class="wrap" id="log"></div></main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask about a procedure, an asset, or a tank…  (Enter to send, Shift+Enter for a newline)"></textarea>
    <button id="send">Send</button>
  </div>
  <!--
    The last two are deliberate probes for Module 3.

    "OSHA benzene PEL" is the important one: it sounds in-domain, it is safety-critical, and
    it is NOT in the procedure library. ARIA as shipped will very likely answer it from the
    model's own knowledge, confidently, with no source. That is the production failure the
    online evaluator catches, the annotation queue confirms, and Module 4 turns into a
    regression test.
  -->
  <div class="hints">
    <button data-q="What's the lockout procedure for P-101A?">lockout P-101A</button>
    <button data-q="What's the level in tank 43?">tank 43 level</button>
    <button data-q="Is nitrogen purge required before entering V-205?">entry V-205</button>
    <button data-q="Raise an urgent work order on P-101A, the inboard seal is leaking. I'm T. Alvarez, badge 8823.">raise a work order</button>
    <button data-q="Take P-101A out of service, the seal is leaking badly. Requested by T. Alvarez, badge 8823." class="probe">shutdown (triggers approval)</button>
    <button data-q="What's the OSHA permissible exposure limit for benzene?" class="probe">OSHA benzene PEL ← probe</button>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), send = $("send"), dot = $("dot");
let threadId = null, busy = false;

const base = () => $("url").value.replace(/\/+$/, "");
const headers = () => {
  const h = { "Content-Type": "application/json" };
  const k = $("key").value.trim();
  if (k) h["x-api-key"] = k;   // Only needed against a deployment.
  return h;
};

function bubble(role, name, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = `<div class="who">${role === "user" ? "YOU" : role === "sys" ? "!" : "ARIA"}</div>
                  <div class="body"><div class="name">${name}</div><div class="text"></div></div>`;
  el.querySelector(".text").textContent = text;
  log.appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "end" });
  return el;
}

async function ensureThread() {
  if (threadId) return threadId;
  const r = await fetch(`${base()}/threads`, {
    method: "POST", headers: headers(), body: JSON.stringify({}),
  });
  if (!r.ok) throw new Error(`POST /threads → ${r.status} ${await r.text()}`);
  threadId = (await r.json()).thread_id;
  return threadId;
}

/* Non-streaming `runs/wait`. Streaming looks nicer; this is far easier to debug in a room
   full of people on different networks, and the whole point of this page is that it works. */
async function run(payload) {
  const tid = await ensureThread();
  const r = await fetch(`${base()}/threads/${tid}/runs/wait`, {
    method: "POST", headers: headers(),
    body: JSON.stringify({ assistant_id: $("graph").value.trim() || "aria", ...payload }),
  });
  if (!r.ok) throw new Error(`runs/wait → ${r.status} ${await r.text()}`);
  return r.json();
}

function render(state) {
  const messages = state?.messages || [];

  // Tool calls, so the room can see the trajectory rather than just the answer. In an
  // observability workshop, showing the work is the entire point.
  const calls = messages.flatMap((m) => m.tool_calls || []);
  const last = [...messages].reverse().find((m) => m.type === "ai" && !(m.tool_calls || []).length);

  let text = last?.content ?? "(no answer returned)";
  if (Array.isArray(text)) {
    text = text.filter((b) => b?.type === "text").map((b) => b.text).join("");
  }

  const el = bubble("aria", "ARIA", text);
  if (calls.length) {
    const t = document.createElement("div");
    t.className = "tools";
    t.textContent = "tools: " + calls.map((c) => `${c.name}(${JSON.stringify(c.args)})`).join("  →  ");
    el.querySelector(".body").appendChild(t);
  }

  // Human-in-the-loop. `request_equipment_shutdown` is gated by `interrupt_on`, so the run
  // comes back paused and we have to answer it. This is the approval gate from Module 2,
  // with a human actually in the loop.
  const interrupts = state?.__interrupt__;
  if (interrupts?.length) renderInterrupt(el, interrupts[0]);
}

function renderInterrupt(parent, intr) {
  const box = document.createElement("div");
  box.className = "interrupt";
  box.innerHTML = `<h3>APPROVAL REQUIRED, the agent has paused before acting</h3>
                   <pre>${JSON.stringify(intr.value ?? intr, null, 2)}</pre>`;

  const mk = (label, resume) => {
    const b = document.createElement("button");
    b.textContent = label;
    if (label !== "Approve") b.className = "ghost";
    b.onclick = async () => {
      box.remove();
      bubble("sys", "human-in-the-loop", `${label} →  resuming the paused run`);
      await guard(() => run({ command: { resume: [resume] } }).then(render));
    };
    return b;
  };

  box.append(
    mk("Approve", { type: "accept" }),
    mk("Reject", { type: "reject", args: "Unit Supervisor declined, hold until turnaround." }),
  );
  parent.querySelector(".body").appendChild(box);
}

async function guard(fn) {
  busy = true; send.disabled = true;
  try {
    await fn();
    dot.className = "ok";
  } catch (e) {
    dot.className = "err";
    bubble("sys", "error", `${e.message}

Checks:
  • is the server running?   langgraph dev
  • is the URL right?        ${base()}
  • deployed target?         paste your LangSmith API key in the "key" box
  • graph name matches langgraph.json?   currently "${$("graph").value}"`);
  } finally {
    busy = false; send.disabled = false; input.focus();
  }
}

async function submit() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  bubble("user", "you", text);
  await guard(() =>
    run({ input: { messages: [{ role: "user", content: text }] } }).then(render)
  );
}

send.onclick = submit;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
});
$("reset").onclick = () => {
  threadId = null;
  log.innerHTML = "";
  bubble("sys", "session", "New thread. Conversation state is empty.");
};
document.querySelectorAll(".hints button").forEach((b) => {
  b.onclick = () => { input.value = b.dataset.q; input.focus(); };
});

bubble("sys", "session",
`Connected to ${base()}, nothing sent yet.

Every message here becomes a trace in your LangSmith project. Modules 3 and 4 read those
traces, so try to break it: ask something out of scope, ask about equipment that doesn't
exist, ask it to do something it shouldn't. The interesting failures are the ones nobody
anticipated, which is exactly why a script can't generate them for you.`);
input.focus();
</script>
</body>
</html>
